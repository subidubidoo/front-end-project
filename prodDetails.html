<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<link rel="stylesheet" href="css/prodDetailsstyle.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>


<div class="product-box">

  <div class="product-image">
    <img src="https://via.placeholder.com/400x400?text=Product+Image" alt="Product">
  </div>

  <div class="product-info">
    <h1>Classic Wool Coat</h1>
    <i class="bi bi-x-lg" id="closing"></i>
    <div class="price">$120.00</div>
    <p class="description">A warm, comfortable wool coat perfect for everyday wear. Made with premium materials for lasting quality.</p>

    <div>
      <label style="color:#3d2828;">Color</label>
      <div class="colors">
        <div class="color-option selected" style="background:#e097b5" data-color="Black"></div>
        <div class="color-option" style="background:#f19f9f" data-color="Red"></div>
        <div class="color-option" style="background:#acd39d" data-color="Green"></div>
        <div class="color-option" style="background:#eed897" data-color="Beige"></div>
      </div>
    </div>

    <div>
      <label style="color:#3d2828;">Size</label>
      <div class="sizes">
        <div class="size-option" data-size="S">S</div>
        <div class="size-option selected" data-size="M">M</div>
        <div class="size-option" data-size="L">L</div>
        <div class="size-option" data-size="XL">XL</div>
      </div>
    </div>

    <button class="add-to-cart" id="addToCartBtn">Add to Cart</button>
  </div>

</div>
<script src="js/productsPage.js"></script>
<script src="js/prodDetailscode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
