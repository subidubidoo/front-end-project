<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<link rel="stylesheet" href="css/prodDetailsstyle.css">
</head>
<body>

<div class="product-box">

  <div class="product-image">
    <img src="https://via.placeholder.com/400x400?text=Product+Image" alt="Product">
  </div>

  <div class="product-info">
    <h1>Classic Wool Coat</h1>
    <div class="price">$120.00</div>
    <p class="description">A warm, comfortable wool coat perfect for everyday wear. Made with premium materials for lasting quality.</p>

    <div>
      <label>Color</label>
      <div class="colors">
        <div class="color-option selected" style="background:#333" data-color="Black"></div>
        <div class="color-option" style="background:#8b0000" data-color="Red"></div>
        <div class="color-option" style="background:#4b6043" data-color="Green"></div>
        <div class="color-option" style="background:#c2b280" data-color="Beige"></div>
      </div>
    </div>

    <div>
      <label>Size</label>
      <div class="sizes">
        <div class="size-option" data-size="S">S</div>
        <div class="size-option selected" data-size="M">M</div>
        <div class="size-option" data-size="L">L</div>
        <div class="size-option" data-size="XL">XL</div>
      </div>
    </div>

    <button class="add-to-cart" id="addToCartBtn">Add to Cart</button>
  </div>

</div>

<script src="js/prodDetailscode.js"></script>
</body>
</html>
